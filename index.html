    <script src="script.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');

            function broadcastPermissions() {
                if (iframe && iframe.contentWindow) {
                    const checkboxes = document.querySelectorAll('input[type="checkbox"][data-tracecode]');
                    const perms = {};
                    checkboxes.forEach(cb => {
                        const tracecode = cb.getAttribute('data-tracecode');
                        if (tracecode) {
                            perms[tracecode] = cb.checked;
                        }
                    });

                    // Add special handling for the stats checkbox
                    const statsCheckbox = document.querySelector('input[value="查看会员在线充值提现统计"]');
                    if (statsCheckbox) {
                        perms['STATS_VISIBILITY'] = statsCheckbox.checked;
                    }

                    iframe.contentWindow.postMessage({ type: 'UPDATE_PERMISSIONS', permissions: perms }, '*');
                }
            }

            if (iframe) {
                iframe.addEventListener('load', broadcastPermissions);
            }

            // Tracecode event listener for permission checkboxes
            const permissionCheckboxes = document.querySelectorAll('input[type="checkbox"][data-tracecode], input[value="查看会员在线充值提现统计"]');
            permissionCheckboxes.forEach(cb => {
                cb.addEventListener('change', (e) => {
                    broadcastPermissions();

                    const tracecode = e.target.getAttribute('data-tracecode');
                    const permName = e.target.value;
                    if (tracecode) {
                        if (e.target.checked) {
                            console.log(`已启用权限 [${permName}] ${tracecode}`);
                        } else {
                            console.log(`已关闭权限 [${permName}] ${tracecode}`);
                        }
                    }
                });
            });

            // Select/Deselect All buttons
            const btnSelectAllPerms = document.getElementById('btnSelectAllPerms');
            const btnDeselectAllPerms = document.getElementById('btnDeselectAllPerms');
            if (btnSelectAllPerms && btnDeselectAllPerms) {
                btnSelectAllPerms.addEventListener('click', () => {
                    permissionCheckboxes.forEach(cb => cb.checked = true);
                    broadcastPermissions();
                });
                btnDeselectAllPerms.addEventListener('click', () => {
                    permissionCheckboxes.forEach(cb => cb.checked = false);
                    broadcastPermissions();
                });
            }

            // Data Mocking Buttons
            const btnMockNoData = document.getElementById('btnMockNoData');
            const btnMockNormal = document.getElementById('btnMockNormal');
            const btnMockExtreme = document.getElementById('btnMockExtreme');
            const mainContentIframe = document.querySelector('iframe');

            function setMockMode(mode) {
                // Update iframe source
                if (mainContentIframe) {
                    mainContentIframe.src = 'content.html?mock=' + mode;
                }

                // Update top nav stats
                const topOnlineCount = document.getElementById('topOnlineCount');
                const topFeedbackCount = document.getElementById('topFeedbackCount');
                if (topOnlineCount) topOnlineCount.innerText = mode === 'nodata' ? '0' : '33';
                if (topFeedbackCount) topFeedbackCount.innerText = mode === 'nodata' ? '0' : '2';

                // Update button styles
                const defaultStyle = 'padding: 2px 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border-color); background: white; border-radius: 4px; color: var(--text-main);';
                const activeStyle = 'padding: 2px 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--primary-color); color: white; background: var(--primary-color); border-radius: 4px;';


                if (btnMockNoData) btnMockNoData.style.cssText = mode === 'nodata' ? activeStyle : defaultStyle;
                if (btnMockNormal) btnMockNormal.style.cssText = mode === 'normal' ? activeStyle : defaultStyle;
                if (btnMockExtreme) btnMockExtreme.style.cssText = mode === 'extreme' ? activeStyle : defaultStyle;
            }

            if (btnMockNoData) btnMockNoData.addEventListener('click', () => setMockMode('nodata'));
            if (btnMockNormal) btnMockNormal.addEventListener('click', () => setMockMode('normal'));
            if (btnMockExtreme) btnMockExtreme.addEventListener('click', () => setMockMode('extreme'));

            // Initialize to normal mode
            // We only need to style the button since the iframe default src can remain empty or handle it via script
            // Wait, to be safe on page load, we will just update button styles and not reload the iframe initially 
            // since the user wants it to default to normal, we can just ensure the iframe src is content.html?mock=normal in HTML
            // or just load it here if the current src is not already mock=normal.

            if (mainContentIframe && !mainContentIframe.src.includes('mock=')) {
                setMockMode('normal');
            } else {
                // Just update styles to match current mode
                const urlParams = new URLSearchParams(mainContentIframe.src.split('?')[1] || '');
                const currentMode = urlParams.get('mock') || 'normal';

                const defaultStyle = 'padding: 2px 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border-color); background: white; border-radius: 4px; color: var(--text-main);';
                const activeStyle = 'padding: 2px 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--primary-color); color: white; background: var(--primary-color); border-radius: 4px;';

                if (btnMockNoData) btnMockNoData.style.cssText = currentMode === 'nodata' ? activeStyle : defaultStyle;
                if (btnMockNormal) btnMockNormal.style.cssText = currentMode === 'normal' ? activeStyle : defaultStyle;
                if (btnMockExtreme) btnMockExtreme.style.cssText = currentMode === 'extreme' ? activeStyle : defaultStyle;
            }
        });
    </script>
