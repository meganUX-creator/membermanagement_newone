<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員管理 Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

    <div class="main-layout">
        <!-- 左側選單 (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="ph-fill ph-user-circle" id="sidebarHeaderIcon"></i>
                <span id="sidebarHeaderTitle">个人中心</span>
                <i class="ph ph-list" id="btnSidebarToggle"
                    style="margin-left:auto; cursor:pointer; font-size:20px; color:var(--text-muted);"
                    title="收起/展開選單"></i>
            </div>
            <nav class="sidebar-nav" style="padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <div style="padding-bottom: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <i class="ph-fill ph-shield-check" style="color: var(--primary-color); font-size: 18px;"></i>
                    <span>權限開關</span>
                </div>
                <div class="permission-checkboxes" style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="查看会员列表" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>查看会员列表</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="新增会员" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>新增会员</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="修改会员" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>修改会员</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="支付層級" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>支付層級</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="删除会员" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>删除会员</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="返点设定" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>返点设定</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="资金明细" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>资金明细</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="注单明细" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>注单明细</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="修改余额" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>修改余额</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="交易设定" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>交易设定</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="变更代理" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>变更代理</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="批量更新用户余额" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>批量更新用户余额</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="导出用户数据" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>导出用户数据</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="批量更新用户联系方式" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>批量更新用户联系方式</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="第三方游戏" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>第三方游戏</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="积分调整" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>积分调整</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="查看会员详情" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>查看会员详情</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="清除稽核记录" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>清除稽核记录</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="代理变更历程" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>代理变更历程</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="查看会员联络资讯" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>查看会员联络资讯</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="回访备注" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>回访备注</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="隐藏资金明细" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>隐藏资金明细</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="用户三方RTP配置" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>用户三方RTP配置</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="批量更新用户状态" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>批量更新用户状态</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="快速登录变更" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>快速登录变更</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="新增银行卡" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>新增银行卡</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员信息审核" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员信息审核</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="编辑代理下会员可玩游戏" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>编辑代理下会员可玩游戏</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="修改银行卡" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>修改银行卡</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="删除银行卡" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>删除银行卡</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员谷歌验证码查看" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员谷歌验证码查看</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="移除会员谷歌验证码" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>移除会员谷歌验证码</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="用户钱包展示" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>用户钱包展示</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="额度修改(链上充值)" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>额度修改(链上充值)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="會員敏感資訊（密碼）" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>會員敏感資訊（密碼）</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="會員敏感資訊（手機）" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>會員敏感資訊（手機）</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="會員敏感資訊（姓名）" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>會員敏感資訊（姓名）</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员赔率设置-查看" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员赔率设置-查看</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员赔率设置-保存" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员赔率设置-保存</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员返水快捷设置" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员返水快捷设置</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员设置最大赔付上限" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员设置最大赔付上限</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="会员赔率设置-重置" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>会员赔率设置-重置</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="批量代理变更" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>批量代理变更</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="批量更新最大提款次数" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>批量更新最大提款次数</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="校验用户任务" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>校验用户任务</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="禁用銀行卡" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>禁用銀行卡</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="编辑标签" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>编辑标签</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="标签编辑纪录" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>标签编辑纪录</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--text-main);">
                        <input type="checkbox" checked value="查看会员在线充值提现统计" style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                        <span>查看会员在线充值提现统计</span>
                    </label>
                </div>
            </nav>
        </aside>

        <!-- 主要內容區 -->
        <main class="main-content">
            <!-- 頂部固釘區塊 (Fixed Sticky Top Header) -->
            <div class="sticky-top-header-container">
                <!-- 頂部列 (Top Bar Header Row 1) -->
                <header class="top-bar">
                    <div class="top-bar-left">
                        <span class="local-time-label">当地时间 : <span id="currentLocalTime">2026/07/22
                                10:27:15</span></span>
                    </div>
                    <div class="top-bar-right">
                        <!-- 消息通知 -->
                        <div class="notification-btn">
                            <i class="ph-fill ph-bell"></i>
                        </div>
                        <!-- 狀態統計與用戶資訊膠囊 -->
                        <div class="info-capsule">
                            <div class="capsule-item">
                                <i class="ph-fill ph-users text-blue-capsule"></i>
                                <span>在线人数 : <span class="num text-blue-num">33</span></span>
                            </div>
                            <div class="capsule-item-divider"></div>
                            <div class="capsule-item">
                                <i class="ph-fill ph-chat-centered-text text-orange-capsule"></i>
                                <span>反馈 : <span class="num text-blue-num">2</span></span>
                            </div>
                            <div class="capsule-item-divider"></div>uu
                            <div class="capsule-item">
                                <i class="ph-fill ph-wallet text-cyan-capsule"></i>
                                <span>充值 : <span class="num text-blue-num">-</span></span>
                            </div>
                            <div class="capsule-item-divider"></div>
                            <div class="capsule-item">
                                <i class="ph-fill ph-arrow-circle-down text-green-capsule"></i>
                                <span>提现 : <span class="num text-blue-num">-</span></span>
                            </div>
                            <div class="capsule-item-divider"></div>
                            <div class="user-dropdown">
                                <i class="ph-fill ph-user-circle"></i>
                                <span class="username">megan</span>
                                <i class="ph ph-caret-down"></i>
                            </div>
                        </div>
                        <!-- 語言選擇器 -->
                        <div class="lang-selector">
                            <span class="flag-icon">🇸🇬</span>
                            <span>简体中文</span>
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </div>
                </header>

                <!-- 麵包屑與分頁標籤區塊 (Breadcrumbs & Page Tabs Row 2) -->
                <section class="page-header-tabs">
                    <div class="breadcrumb-row">
                        <div class="breadcrumb-path">
                            位置 <i class="ph ph-caret-right"></i> 会员
                        </div>
                        <div class="tabs-options-dropdown">
                            <span>标签选项</span>
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </div>
                    <div class="tabs-container">
                        <div class="tab-item">充值活动管理 <span class="tab-close">×</span></div>
                        <div class="tab-item active">会员 <span class="tab-close">×</span></div>
                        <div class="tab-item">用户标签编辑记录 <span class="tab-close">×</span></div>
                        <div class="tab-item">返水审核 <span class="tab-close">×</span></div>
                        <div class="tab-item">合营代理申请审核 <span class="tab-close">×</span></div>
                        <div class="tab-item">在线用户 <span class="tab-close">×</span></div>
                        <div class="tab-item">子账号 <span class="tab-close">×</span></div>
                        <div class="tab-item">成长值配置 <span class="tab-close">×</span></div>
                    </div>
                </section>
            </div>

            <div class="iframe-container" style="flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; background-color: var(--bg-body);">
                <iframe src="content.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statsCheckbox = document.querySelector('input[value="查看会员在线充值提现统计"]');
            const iframe = document.querySelector('iframe');
            
            function updateStatsBarVisibility() {
                if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                    const statsBar = iframe.contentWindow.document.getElementById('bottomStatsBar');
                    if (statsBar) {
                        statsBar.style.display = statsCheckbox.checked ? 'flex' : 'none';
                    }
                }
            }

            if (statsCheckbox) {
                statsCheckbox.addEventListener('change', updateStatsBarVisibility);
            }

            if (iframe) {
                iframe.addEventListener('load', updateStatsBarVisibility);
            }
        });
    </script>
</body>

</html>
